<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="1199" height="329" rx="24" fill="#05060b" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="80" y="48" font-size="12" font-weight="700" fill="#5ee7ff" letter-spacing="2.5">THE TRUST LADDER · trustScore() → termsFor()</text>

  <!-- agent markers (score → x = 80 + (score-300) * 1.7333) -->
  <g font-size="14">
    <!-- Rogue 441 -->
    <line x1="324" y1="112" x2="324" y2="150" stroke="#ffb65c" stroke-opacity="0.6" stroke-dasharray="2 3"/>
    <circle cx="324" cy="96" r="14" fill="#ffb65c" fill-opacity="0.18" stroke="#ffb65c"/>
    <text x="324" y="101" text-anchor="middle" font-weight="700" fill="#ffb65c">R</text>
    <text x="302" y="92" text-anchor="end" font-weight="600" fill="#f3f5ff">Rogue</text>
    <text x="302" y="109" text-anchor="end" fill="#8a93b5">441 · defaulted</text>
    <!-- Nova 561 -->
    <line x1="532" y1="88" x2="532" y2="150" stroke="#5ee7ff" stroke-opacity="0.6" stroke-dasharray="2 3"/>
    <circle cx="532" cy="72" r="14" fill="#5ee7ff" fill-opacity="0.15" stroke="#5ee7ff"/>
    <text x="532" y="77" text-anchor="middle" font-weight="700" fill="#5ee7ff">N</text>
    <text x="510" y="68" text-anchor="end" font-weight="600" fill="#f3f5ff">Nova</text>
    <text x="510" y="85" text-anchor="end" fill="#8a93b5">561 · just promoted</text>
    <!-- Orbit 591 -->
    <line x1="584" y1="122" x2="584" y2="150" stroke="#5ee7ff" stroke-opacity="0.6" stroke-dasharray="2 3"/>
    <circle cx="584" cy="106" r="14" fill="#5ee7ff" fill-opacity="0.15" stroke="#5ee7ff"/>
    <text x="584" y="111" text-anchor="middle" font-weight="700" fill="#5ee7ff">O</text>
    <text x="606" y="102" font-weight="600" fill="#f3f5ff">Orbit</text>
    <text x="606" y="119" fill="#8a93b5">591</text>
    <!-- Atlas 760 -->
    <line x1="877" y1="112" x2="877" y2="150" stroke="#f2cd85" stroke-opacity="0.6" stroke-dasharray="2 3"/>
    <circle cx="877" cy="96" r="14" fill="#f2cd85" fill-opacity="0.16" stroke="#f2cd85"/>
    <text x="877" y="101" text-anchor="middle" font-weight="700" fill="#f2cd85">A</text>
    <text x="899" y="92" font-weight="600" fill="#f3f5ff">Atlas</text>
    <text x="899" y="109" fill="#8a93b5">760 · $85 tab</text>
  </g>

  <!-- bar -->
  <rect x="80" y="150" width="451" height="16" rx="8" fill="#ffb65c" fill-opacity="0.85"/>
  <rect x="535" y="150" width="236" height="16" rx="8" fill="#5ee7ff" fill-opacity="0.85"/>
  <rect x="775" y="150" width="345" height="16" rx="8" fill="#f2cd85" fill-opacity="0.9"/>
  <circle cx="324" cy="158" r="5" fill="#05060b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="532" cy="158" r="5" fill="#05060b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="584" cy="158" r="5" fill="#05060b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="877" cy="158" r="5" fill="#05060b" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g font-size="13" fill="#5d6687" font-family="'JetBrains Mono', Consolas, monospace">
    <text x="80" y="192">300</text>
    <text x="533" y="192" text-anchor="middle">560</text>
    <text x="773" y="192" text-anchor="middle">700</text>
    <text x="1120" y="192" text-anchor="end">900</text>
  </g>

  <g>
    <text x="80" y="236" font-size="20" font-weight="700" fill="#ffb65c" letter-spacing="1">PREPAY</text>
    <text x="80" y="262" font-size="15" fill="#aab3d1">Pay first, goods after.</text>
    <text x="80" y="284" font-size="15" fill="#8a93b5">Below 560, or any default.</text>

    <text x="545" y="236" font-size="20" font-weight="700" fill="#5ee7ff" letter-spacing="1">NET 7</text>
    <text x="545" y="262" font-size="15" fill="#aab3d1">Goods first, pay in 7 days.</text>
    <text x="545" y="284" font-size="15" fill="#8a93b5">Limit $25.</text>

    <text x="785" y="236" font-size="20" font-weight="700" fill="#f2cd85" letter-spacing="1">CREDIT TAB</text>
    <text x="785" y="262" font-size="15" fill="#aab3d1">Open tab, settle in 30 days.</text>
    <text x="785" y="284" font-size="15" fill="#8a93b5">Limit $25 + (score − 700), up to $225.</text>
  </g>
</svg>
